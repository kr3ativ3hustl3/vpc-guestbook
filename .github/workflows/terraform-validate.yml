name: Terraform Validate

# Read-only checks — no AWS credentials needed, no infrastructure
# changes. Just confirms the Terraform is syntactically valid and
# consistently formatted before anyone applies it by hand.
on:
  push:
    paths:
      - "terraform/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform fmt check
        run: terraform fmt -check -recursive terraform/

      - name: Terraform init (no backend, validate only)
        run: terraform init -backend=false
        working-directory: terraform

      - name: Terraform validate
        run: terraform validate
        working-directory: terraform

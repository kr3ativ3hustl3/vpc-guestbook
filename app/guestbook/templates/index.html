<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VPC Guestbook</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      max-width: 640px;
      margin: 3rem auto;
      padding: 0 1.5rem;
      line-height: 1.6;
      color: #1a1a1a;
    }
    h1 { font-size: 1.6rem; }
    form { margin: 1.5rem 0; display: flex; flex-direction: column; gap: 0.6rem; }
    input, textarea {
      padding: 0.5rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-family: inherit;
    }
    button {
      padding: 0.5rem 1rem;
      border: none;
      border-radius: 4px;
      background: #2563eb;
      color: white;
      cursor: pointer;
      width: fit-content;
    }
    .entry {
      border-bottom: 1px solid #eee;
      padding: 0.75rem 0;
    }
    .entry .name { font-weight: 600; }
    .entry .time { color: #888; font-size: 0.8rem; }
    .error {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #991b1b;
      padding: 0.75rem;
      border-radius: 4px;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <h1>VPC Guestbook</h1>
  <p>A small three-tier AWS app: ALB &rarr; EC2 Auto Scaling Group &rarr; RDS Postgres.</p>

  {% if db_error %}
  <div class="error">
    Couldn't reach the database yet: {{ db_error }}
  </div>
  {% endif %}

  <form method="POST" action="/sign">
    <input type="text" name="name" placeholder="Your name" maxlength="100" required />
    <textarea name="message" placeholder="Leave a message" maxlength="500" rows="3" required></textarea>
    <button type="submit">Sign the guestbook</button>
  </form>

  {% for entry in entries %}
  <div class="entry">
    <div class="name">{{ entry.name }}</div>
    <div>{{ entry.message }}</div>
    <div class="time">{{ entry.created_at }}</div>
  </div>
  {% endfor %}
</body>
</html>
